<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>abox-link 文件管理器</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/file-manager.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <img class="brand-mark" src="/img/logo.svg" width="20" height="20" alt="">
    <strong>ABOX-LINK</strong>
    <span class="brand-ver" id="hdr-version"></span>
  </div>
  <div class="top-tools">
    <label class="language-picker">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h12M10 3v2M7 5c0 5 3 8 7 10M13 5c0 5-3 8-7 10m8 6 4-10 4 10m-6-4h4"/></svg>
      <select id="interface-language" aria-label="界面语言" data-i18n-aria-label="界面语言"></select>
    </label>
    <div class="acct">
      <span class="acct-name" id="hdr-acct"></span>
      <span class="dot" id="hdr-dot"></span>
    </div>
    <button id="connection-toggle" type="button" class="connection-toggle hidden"
            aria-expanded="false" aria-controls="panel-body" aria-label="连接设置" data-i18n-aria-label="连接设置">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h4m4 0h8M8 3v6M4 12h10m4 0h2m-6-3v6M4 18h2m4 0h10M10 15v6"/></svg>
      <span class="connection-toggle-label" data-i18n>连接参数</span>
      <svg class="connection-chevron" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
    </button>
  </div>
  <section id="panel-body" class="connection-panel" aria-labelledby="connection-title" hidden>
    <div class="connection-heading">
      <div>
        <h2 id="connection-title" data-i18n>连接设置</h2>
        <p id="connection-account" class="connection-account"></p>
      </div>
      <button type="button" class="fm-icon ghost" id="connection-close" data-fm-icon="close" aria-label="关闭" data-i18n-aria-label="关闭"></button>
    </div>
    <div class="connection-content">
      <div class="connection-grid">
        <section>
          <h3 data-i18n>选项</h3>
          <label class="check connection-option">
            <input type="checkbox" id="opt-auto">
            <span data-i18n>启动时自动连接 AgentBox</span>
          </label>
          <label class="check connection-option">
            <input type="checkbox" id="opt-boot">
            <span><span data-i18n>开机自启</span> <span class="hint" id="boot-detail"></span></span>
          </label>
          <label class="check connection-option">
            <input type="checkbox" id="opt-insecure">
            <span data-i18n>跳过 TLS 证书校验（服务器用自签名证书时才勾）</span>
          </label>
          <div class="unpair">
            <button class="ghost danger" id="btn-unpair" type="button" data-icon="unlink" data-i18n>解除绑定</button>
            <span class="hint" data-i18n>清除登录凭证与共享设置</span>
          </div>
        </section>
        <section>
          <h3 data-i18n>共享文件夹</h3>
          <p class="connection-hint" data-i18n>连接后可在 AgentBox 的「文件 → 从我的电脑」中只读浏览这些文件夹。</p>
          <div id="local-folder-list" class="rules"></div>
          <form id="local-folder-form" class="rules">
            <label><span data-i18n>显示名称</span><input type="text" id="local-folder-name" required maxlength="128"></label>
            <label><span data-i18n>本机文件夹的绝对路径</span><input type="text" id="local-folder-path" required spellcheck="false" placeholder="C:\AgentBox\Exchange"></label>
            <div><button id="local-folder-add" class="ghost" type="submit" data-icon="plus" data-i18n>添加文件夹</button></div>
          </form>
        </section>
      </div>
    </div>
  </section>
</header>

<main>

  <!-- 首次使用：粘贴配对码 -->
  <section class="card card-pair hidden" id="card-pair">
    <img class="pair-mascot" src="/img/mascot.svg" width="104" height="90" alt="">
    <div class="pair-body">
      <h2 data-i18n>接入你的 agentbox</h2>
      <p data-i18n>打开浏览器里的 agentbox → 侧栏「连接设备」 → 点「生成配对码」，把那串字符粘到下面。不需要在这里输密码。</p>
      <textarea id="pair-code" rows="3" spellcheck="false"
                placeholder="ABOX1-…" aria-label="配对码" data-i18n-aria-label="配对码"></textarea>
      <label class="check">
        <input type="checkbox" id="pair-insecure">
        <span data-i18n>服务器用的是自签名证书，跳过证书校验</span>
      </label>
      <div class="row">
        <button class="primary" id="btn-pair" data-icon="link" data-i18n>接入</button>
        <span class="err" id="pair-err"></span>
      </div>
    </div>
  </section>

  <!-- 已配对：电路与开关 -->
  <section class="link hidden" id="card-status">
    <div class="wire" id="wire">
      <span class="term term-a">
        <span class="lamp"></span>
        <span class="term-label">agentbox</span>
      </span>
      <span class="leg leg-a"><i class="glint"></i></span>
      <span class="node">
        <span class="node-mark"></span>
        <span class="term-label" data-i18n>本机</span>

      </span>
      <span class="leg leg-b"></span>
      <span class="term term-b">
        <span class="lamp"></span>
        <span class="term-label" data-i18n>共享文件</span>
      </span>
    </div>
    <div class="link-foot">
      <div class="link-read">
        <span class="st-label" data-i18n>共享访问</span>
        <div class="st-title" id="st-title" data-i18n>未连接</div>
        <div class="st-sub" id="st-sub"></div>
      </div>
      <button class="primary" id="btn-toggle" data-icon="play" data-i18n>连接</button>
    </div>
  </section>


  <section id="file-manager" class="file-manager hidden" aria-labelledby="fm-heading">
    <h1 id="fm-heading" data-i18n>文件管理器</h1>
    <div class="fm-panes">
    <section class="fm-pane" id="fm-local" aria-labelledby="fm-local-title">
      <header class="fm-pane-head">
        <div class="fm-pane-title">
          <span class="fm-pane-icon" data-fm-icon="computer" aria-hidden="true"></span>
          <h2 data-i18n id="fm-local-title">本机</h2>
        </div>
        <button class="ghost" id="fm-pick-folder" type="button" data-icon="plus" data-i18n>添加文件夹</button>
      </header>
      <div class="fm-pane-tools">
        <select id="fm-local-root" aria-label="本机文件夹" data-i18n-aria-label="本机文件夹"></select>
        <button type="button" class="fm-icon" id="fm-local-refresh" data-fm-icon="refresh" title="刷新" data-i18n-title="刷新" aria-label="刷新" data-i18n-aria-label="刷新"></button>
      </div>
      <div class="fm-path">
        <button class="fm-icon" id="fm-local-back" type="button" data-fm-icon="up" title="上一级" data-i18n-title="上一级" aria-label="上一级" data-i18n-aria-label="上一级"></button>
        <nav id="fm-local-crumbs" class="fm-crumbs" aria-label="本机" data-i18n-aria-label="本机"></nav>
      </div>
      <div class="fm-search">
        <span data-fm-icon="search" aria-hidden="true"></span>
        <input id="fm-local-filter" type="search" data-i18n-placeholder="按名称查找" data-i18n-aria-label="按名称查找" aria-label="按名称查找" placeholder="按名称查找" autocomplete="off">
      </div>
      <div class="fm-list-head">
        <input id="fm-local-all" type="checkbox" aria-label="选择所有文件" data-i18n-aria-label="选择所有文件">
        <button class="fm-sort" id="fm-local-sort" type="button"><span data-i18n>名称</span> <span data-fm-icon="chevron" aria-hidden="true"></span></button>
        <span class="fm-size" data-i18n>大小</span>
        <span></span>
      </div>
      <ul class="fm-list" id="fm-local-list"></ul>
      <p class="fm-empty" id="fm-local-notice" role="status"></p>
      <footer class="fm-pane-foot"><span id="fm-local-count"></span><button class="ghost" type="button" id="fm-local-copy" data-icon="right" data-i18n>复制到服务器</button></footer>
    </section>

    <section class="fm-pane" id="fm-remote" aria-labelledby="fm-remote-title">
      <header class="fm-pane-head">
        <div class="fm-pane-title">
          <span class="fm-pane-icon" data-fm-icon="workspace" aria-hidden="true"></span>
          <h2 data-i18n id="fm-remote-title">工作空间</h2>
        </div>
        <button class="ghost" id="fm-mkdir" type="button" data-icon="folderPlus" data-i18n>新建文件夹</button>
      </header>
      <div class="fm-pane-tools">
        <select id="fm-remote-root" aria-label="选择工作空间" data-i18n-aria-label="选择工作空间"></select>
        <button type="button" class="fm-icon" id="fm-remote-refresh" data-fm-icon="refresh" title="刷新" data-i18n-title="刷新" aria-label="刷新" data-i18n-aria-label="刷新"></button>
      </div>
      <div class="fm-path">
        <button class="fm-icon" id="fm-remote-back" type="button" data-fm-icon="up" title="上一级" data-i18n-title="上一级" aria-label="上一级" data-i18n-aria-label="上一级"></button>
        <nav id="fm-remote-crumbs" class="fm-crumbs" aria-label="工作空间" data-i18n-aria-label="工作空间"></nav>
      </div>
      <div class="fm-search">
        <span data-fm-icon="search" aria-hidden="true"></span>
        <input id="fm-remote-filter" type="search" data-i18n-placeholder="按名称查找" data-i18n-aria-label="按名称查找" aria-label="按名称查找" placeholder="按名称查找" autocomplete="off">
      </div>
      <div class="fm-list-head">
        <input id="fm-remote-all" type="checkbox" aria-label="选择所有文件" data-i18n-aria-label="选择所有文件">
        <button class="fm-sort" id="fm-remote-sort" type="button"><span data-i18n>名称</span> <span data-fm-icon="chevron" aria-hidden="true"></span></button>
        <span class="fm-size" data-i18n>大小</span>
        <span></span>
      </div>
      <ul class="fm-list" id="fm-remote-list"></ul>
      <p class="fm-empty" id="fm-remote-notice" role="status"></p>
      <footer class="fm-pane-foot"><span id="fm-remote-count"></span><button class="ghost" type="button" id="fm-remote-copy" data-icon="left" data-i18n>保存到电脑</button></footer>
    </section>
    </div>
    <section id="fm-transfers" class="fm-transfers hidden" aria-labelledby="fm-transfers-title">
      <div class="fm-transfer-head"><h2 id="fm-transfers-title" data-i18n>传输队列</h2><button type="button" class="ghost" id="fm-clear" data-i18n>清除已结束的传输</button></div>
      <ul class="fm-queue" id="fm-queue"></ul>
    </section>
  </section>
  <dialog id="fm-dialog" class="fm-dialog" aria-labelledby="fm-dialog-title">
    <form method="dialog">
      <h2 id="fm-dialog-title"></h2>
      <p id="fm-dialog-text"></p>
      <label id="fm-dialog-label"><span class="hidden" id="fm-dialog-input-label"></span><input id="fm-dialog-input" type="text" autocomplete="off" aria-labelledby="fm-dialog-input-label"></label>
      <div id="fm-dialog-actions" class="fm-dialog-actions"></div>
    </form>
  </dialog>
  <dialog id="fm-preview" class="fm-dialog fm-preview" aria-labelledby="fm-preview-title">
    <form method="dialog"><header><h2 id="fm-preview-title"></h2><button class="fm-icon" type="submit" data-fm-icon="close" data-i18n-aria-label="关闭" aria-label="关闭"></button></header></form>
    <img id="fm-preview-image" alt="">
  </dialog>

</main>

<div class="toast hidden" id="toast"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
